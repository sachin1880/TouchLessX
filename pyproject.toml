[project]
name = "touchlessx"
version = "1.3.0"
description = "Webcam hand-gesture control for the desktop, processed locally."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "opencv-python>=4.9,<5",
    "mediapipe>=0.10.14,<=0.10.21",
    "numpy>=1.26,<2",
    "pyautogui>=0.9.54,<1",
    "customtkinter>=5.2,<6",
    "pillow>=10.0,<11",
    "scikit-learn>=1.4,<2",
    "vosk>=0.3.44,<0.4",
    "sounddevice>=0.4",
    "faster-whisper>=1.0,<2",
    "pyobjc-framework-ApplicationServices>=10; sys_platform == 'darwin'",
    "aiortc>=1.9,<2",
    "websockets>=12,<16",
    "pyobjc-framework-Vision>=10; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
